name: webtoprint

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on: [php]
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    depends_on: [postgres, redis, minio]
    env_file: [.env]
    volumes:
      - ./backend:/var/www/html:cached
      - ./custom:/var/www/custom:cached
      - ./packages:/var/www/packages:cached
    working_dir: /var/www/html

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    depends_on: [postgres, redis, minio]
    env_file: [.env]
    volumes:
      - ./backend:/var/www/html:cached
      - ./custom:/var/www/custom:cached
    working_dir: /var/www/html
    command: ["php", "artisan", "horizon"]

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    depends_on: [postgres, redis]
    env_file: [.env]
    volumes:
      - ./backend:/var/www/html:cached
      - ./custom:/var/www/custom:cached
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]

  # Single-host aggregator for ngrok-free: fans out one public hostname to
  # storefront / designer / backend / shop via path prefixes.
  nginx-public:
    image: nginx:1.27-alpine
    depends_on: [nginx, nginx-shop, designer, storefront]
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/public.conf:/etc/nginx/conf.d/default.conf:ro

  nginx-shop:
    image: nginx:1.27-alpine
    depends_on: [php-shop]
    ports:
      - "8001:80"
    volumes:
      - ./backend-shop:/var/www/html:cached
      - ./docker/nginx/shop.conf:/etc/nginx/conf.d/default.conf:ro

  php-shop:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    depends_on: [postgres, redis]
    env_file: [./backend-shop/.env]
    volumes:
      - ./backend-shop:/var/www/html:cached
      - ./backend:/var/www/backend:cached
      - ./custom:/var/www/custom:cached
      - shop_sqlite:/var/lib/wtp-shop
    working_dir: /var/www/html

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webtoprint
      POSTGRES_USER: webtoprint
      POSTGRES_PASSWORD: webtoprint
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: webtoprint
      MINIO_ROOT_PASSWORD: webtoprint-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 webtoprint webtoprint-secret; do sleep 1; done;
      /usr/bin/mc mb -p local/webtoprint || true;
      /usr/bin/mc anonymous set download local/webtoprint || true;
      "

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: webtoprint-meili-master
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data

  storefront:
    image: node:22-alpine
    working_dir: /app
    depends_on: [nginx, nginx-shop]
    environment:
      # Server-side (SSR) URL — must resolve inside the docker network.
      INTERNAL_API_URL: http://nginx/api/v1
      # Browser-side URLs — what the user types in their address bar.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000/api/v1}
      PUBLIC_SHOP_API_URL: ${PUBLIC_SHOP_API_URL:-http://localhost:8001/api/v1}
      PUBLIC_DESIGNER_URL: ${PUBLIC_DESIGNER_URL:-http://localhost:5173}
    volumes:
      - ./storefront:/app:cached
      - storefront_node_modules:/app/node_modules
    command: ["sh", "-c", "corepack enable && corepack prepare pnpm@9.15.4 --activate && pnpm install && pnpm dev --host 0.0.0.0"]
    ports:
      - "4321:4321"

  designer:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
      VITE_STOREFRONT_URL: ${VITE_STOREFRONT_URL:-http://localhost:4321}
    volumes:
      - ./designer:/app:cached
      - designer_node_modules:/app/node_modules
    command: ["sh", "-c", "corepack enable && corepack prepare pnpm@9.15.4 --activate && pnpm install && pnpm dev --host 0.0.0.0"]
    ports:
      - "5173:5173"

volumes:
  pgdata:
  redisdata:
  miniodata:
  meilidata:
  storefront_node_modules:
  designer_node_modules:
  shop_sqlite:
