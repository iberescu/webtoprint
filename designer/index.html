<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Designer — PrintHub</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <style>
      :root {
        --bg: #0f172a; --panel: #ffffff; --ink: #0f172a; --muted: #64748b;
        --accent: #4f46e5; --amber: #f59e0b; --safe: #10b981; --danger: #ef4444;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #f1f5f9; }

      .shell { display: grid; grid-template-rows: 56px 1fr; grid-template-columns: 64px 280px 1fr 320px; height: 100vh; }
      .topbar { grid-column: 1 / -1; background: var(--bg); color: white; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; box-shadow: 0 1px 0 #1e293b; }
      .topbar .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; }
      .topbar .brand img { width: 28px; height: 28px; border-radius: 6px; }
      .topbar .actions { display: flex; gap: 8px; }
      .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 8px; border: 0; font-weight: 600; font-size: 13px; cursor: pointer; }
      .btn-primary { background: var(--amber); color: #0f172a; }
      .btn-primary:hover { background: #fbbf24; }
      .btn-ghost { background: transparent; color: white; }
      .btn-ghost:hover { background: rgba(255,255,255,0.08); }
      .btn-secondary { background: white; color: var(--ink); border: 1px solid #e2e8f0; }
      .btn-secondary:hover { background: #f8fafc; }

      .sidebar { background: var(--bg); color: white; display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 4px; }
      .sidebar button { width: 48px; height: 48px; border-radius: 10px; background: transparent; color: rgba(255,255,255,0.7); border: 0; cursor: pointer; display: grid; place-items: center; font-size: 11px; gap: 2px; padding: 4px; flex-direction: column; display: flex; align-items: center; justify-content: center; }
      .sidebar button.active, .sidebar button:hover { background: rgba(255,255,255,0.08); color: white; }
      .sidebar svg { width: 22px; height: 22px; }

      .panel { background: var(--panel); border-right: 1px solid #e2e8f0; overflow-y: auto; padding: 16px; }
      .panel h2 { margin: 0 0 12px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
      .panel-section { margin-bottom: 20px; }
      .panel-section h3 { margin: 0 0 8px; font-size: 12px; font-weight: 700; color: var(--ink); }

      .templates { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .template-card { aspect-ratio: 4/3; border-radius: 8px; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; overflow: hidden; position: relative; border: 2px solid transparent; }
      .template-card:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(15,23,42,0.1); border-color: var(--accent); }

      .stage-wrap { background: #e2e8f0; display: flex; align-items: center; justify-content: center; padding: 32px; overflow: auto; position: relative; }
      .stage-info { position: absolute; top: 12px; left: 16px; background: white; padding: 6px 12px; border-radius: 6px; font-size: 12px; color: var(--muted); display: flex; gap: 12px; align-items: center; box-shadow: 0 1px 3px rgba(15,23,42,0.08); }
      .stage-info strong { color: var(--ink); }
      .stage-info .legend { display: inline-flex; gap: 8px; align-items: center; }
      .stage-info .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
      .canvas-frame { background: white; box-shadow: 0 4px 24px rgba(15,23,42,0.15); display: grid; place-items: center; position: relative; }

      .right { background: var(--panel); border-left: 1px solid #e2e8f0; overflow-y: auto; padding: 16px; }
      .right h2 { margin: 0 0 12px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
      .field { display: grid; gap: 4px; margin-bottom: 12px; }
      .field label { font-size: 12px; font-weight: 600; color: var(--ink); }
      .field input[type=text], .field input[type=number], .field select { padding: 8px 10px; border: 1px solid #e2e8f0; border-radius: 8px; font: inherit; }
      .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .colors { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
      .colors button { aspect-ratio: 1; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; }
      .colors button:hover { transform: scale(1.1); }

      .uploads { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .upload-tile { aspect-ratio: 1; border: 2px dashed #cbd5e1; border-radius: 8px; display: grid; place-items: center; cursor: pointer; color: var(--muted); font-size: 11px; text-align: center; padding: 8px; }
      .upload-tile:hover { background: #f1f5f9; border-color: var(--accent); }
      .upload-tile img { max-width: 100%; max-height: 100%; object-fit: contain; }

      #status { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--bg); color: white; padding: 10px 16px; border-radius: 8px; font-size: 12px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
      #status.show { opacity: 1; }

      .empty-state { padding: 32px 16px; text-align: center; color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="shell">
      <!-- Top bar -->
      <header class="topbar">
        <div class="brand">
          <img src="/logo.png" alt="" />
          <span>PrintHub Designer</span>
          <span style="opacity: 0.6; font-weight: 400; margin-left: 8px;" id="product-name">Untitled design</span>
        </div>
        <div class="actions">
          <button class="btn btn-ghost" id="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
          <button class="btn btn-ghost" id="redo" title="Redo (Ctrl+Y)">↷ Redo</button>
          <button class="btn btn-secondary" id="save">💾 Save draft</button>
          <button class="btn btn-secondary" id="preview">👁 Preview</button>
          <button class="btn btn-primary" id="approve">✓ Approve & continue</button>
        </div>
      </header>

      <!-- Left: tool sidebar -->
      <nav class="sidebar">
        <button class="active" data-panel="templates" title="Templates">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span>Templates</span>
        </button>
        <button data-panel="text" title="Text">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h14M12 4v16"/></svg>
          <span>Text</span>
        </button>
        <button data-panel="uploads" title="Uploads">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
          <span>Uploads</span>
        </button>
        <button data-panel="shapes" title="Shapes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="4"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>
          <span>Shapes</span>
        </button>
        <button data-panel="colors" title="Colors">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>
          <span>Colors</span>
        </button>
        <button data-panel="qr" title="QR code">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h2v2h-2zM18 14h3v3h-3zM14 18h2v3h-2zM18 21h3M21 18v3"/></svg>
          <span>QR code</span>
        </button>
      </nav>

      <!-- Left panel content -->
      <aside class="panel" id="panel">
        <!-- populated by JS based on active sidebar tab -->
      </aside>

      <!-- Stage -->
      <main class="stage-wrap" id="stage">
        <div class="stage-info">
          <span><strong>85 × 55 mm</strong> · 350 gsm Premium Silk</span>
          <span class="legend">
            <span class="swatch" style="background: #ef4444"></span> Bleed
            <span class="swatch" style="background: #10b981"></span> Safe area
          </span>
        </div>
        <div class="canvas-frame">
          <canvas id="canvas" width="600" height="400"></canvas>
        </div>
      </main>

      <!-- Right: properties / order summary -->
      <aside class="right" id="right">
        <h2>Order summary</h2>
        <div class="field">
          <label>Product</label>
          <input type="text" id="prop-product" value="Standard Business Card" readonly />
        </div>
        <div class="row">
          <div class="field">
            <label>Quantity</label>
            <select><option>100</option><option>250</option><option>500</option><option>1 000</option></select>
          </div>
          <div class="field">
            <label>Sides</label>
            <select><option>Double</option><option>Single</option></select>
          </div>
        </div>

        <h2 style="margin-top: 20px">Selected layer</h2>
        <div id="props"><div class="empty-state">Click any element on the canvas to edit it.</div></div>
      </aside>
    </div>

    <div id="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
