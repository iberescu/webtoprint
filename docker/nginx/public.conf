# Aggregator nginx for ngrok-free: ONE public host fans out to the four
# internal services via path prefixes.
#
#   /                  → storefront  (Astro, with HMR websocket on /)
#   /api/v1/*          → backend     (Laravel, port 8000)
#   /shop/api/v1/*     → backend-shop (Laravel, port 8001, /shop/ stripped)
#   /designer/         → designer    (Vite, base=/designer/)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# When ngrok-agent forwards a TLS-terminated request, it sets
# X-Forwarded-Proto: https. Use that if present; otherwise fall back to
# the scheme the agent used to hit us (http on localhost:8080).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 256M;

    # ---------------------------------------------------------------- backend
    # Print backend exposes /api/v1/* directly; pass through verbatim.
    location /api/v1/ {
        proxy_pass http://nginx/api/v1/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 300s;
    }

    # Backend web routes (Filament admin panel, Livewire wire, Horizon, Swagger).
    # These are NOT under /api/v1 because they're traditional server-rendered
    # pages — forward to the same backend nginx and let it serve them.
    #
    # The /css/filament/ and /js/filament/ prefixes are Filament's published
    # assets (php artisan filament:assets) — Astro storefront has none of
    # those paths, so it's safe to forward them unconditionally.
    location ~ ^/(admin|livewire|filament|horizon|docs|_ignition|storage|css/filament|js/filament)(/|$) {
        proxy_pass http://nginx;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 300s;
    }

    # ----------------------------------------------------------- backend-shop
    # Shop backend ALSO uses /api/v1/* internally — strip /shop/ to map.
    location /shop/api/v1/ {
        proxy_pass http://nginx-shop/api/v1/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 300s;
    }

    # --------------------------------------------------------------- designer
    # Vite is configured with base=/designer/ so its asset paths match.
    location /designer/ {
        proxy_pass http://designer:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
    }

    # ------------------------------------------------------------- storefront
    # Astro/Vite at root, with HMR websocket support.
    location / {
        proxy_pass http://storefront:4321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
    }
}
