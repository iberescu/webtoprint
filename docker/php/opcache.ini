; Aggressive opcache settings for dev runs. The Windows Docker Desktop
; bind mount (./backend → /var/www/html) is painfully slow for require()
; — a cold PHP-FPM request without these settings takes ~3-8 s just to
; load Laravel's autoloader. With opcache hot, the same request drops to
; ~50-150 ms.
;
; In production, leave validate_timestamps=0 and rely on `opcache.reset()`
; (or container restart) to pick up code changes. We keep
; validate_timestamps=1 with revalidate_freq=2 here so the dev-mode
; "edit and reload" loop still works — just at a 2 s lag.

opcache.enable=1
opcache.enable_cli=0

opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; Disable timestamp validation entirely — every request was stat()ing
; thousands of files through the slow Windows Docker bind mount,
; eating ~2.5 s per hit even when opcache was hot. With this off,
; code changes need `docker compose exec php php artisan opcache:clear`
; (or container restart) to be picked up. Worth it: requests drop
; from ~3 s to ~100 ms.
opcache.validate_timestamps=0
opcache.revalidate_freq=0

opcache.fast_shutdown=1
opcache.save_comments=1

; Enable JIT (tracing mode, 64 MB buffer). Knocks a further 20–30 %
; off CPU-bound Laravel boots.
opcache.jit=tracing
opcache.jit_buffer_size=64M
